name: reVC legacy ASI (Windows and Linux-Wine)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/extras/legacy_asi*'
      - 'src/core/Game.cpp'
      - 'src/core/main.cpp'
      - 'src/skel/glfw/glfw.cpp'
      - 'src/skel/win/win.cpp'
      - 'utils/legacy-asi/**'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      - 'premake5.lua'
      - '.gitattributes'
      - '.github/workflows/reVC_legacy_asi.yml'
  pull_request:
    paths:
      - 'src/extras/legacy_asi*'
      - 'src/core/Game.cpp'
      - 'src/core/main.cpp'
      - 'src/skel/glfw/glfw.cpp'
      - 'src/skel/win/win.cpp'
      - 'utils/legacy-asi/**'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      - 'premake5.lua'
      - '.gitattributes'
      - '.github/workflows/reVC_legacy_asi.yml'

permissions:
  contents: read

jobs:
  source-tests:
    name: Linux launcher and package defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test launcher without Wine or executable mods
        run: |
          python3 utils/legacy-asi/linux/test_launcher.py
          python3 utils/legacy-asi/linux/test_probe_runner.py
      - name: Test page-protection policy and x86 branch arithmetic
        run: |
          mkdir -p build/legacy-asi-portable-tests
          g++ -std=c++17 -Wall -Wextra -Werror utils/legacy-asi/tests/page_protection_tests.cpp -o build/legacy-asi-portable-tests/page-protection
          build/legacy-asi-portable-tests/page-protection
          g++ -std=c++17 -Wall -Wextra -Werror utils/legacy-asi/tests/rel32_tests.cpp -o build/legacy-asi-portable-tests/rel32
          build/legacy-asi-portable-tests/rel32
      - name: Test empty defaults and preservation of user manifests
        run: cmake -P utils/legacy-asi/tests/package_defaults_tests.cmake

  experimental:
    name: Experimental x86 | ${{ matrix.renderer }}
    needs: source-tests
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        renderer: [d3d9, gl3_glfw]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Test local fixed-address fixtures, not external mods
        timeout-minutes: 5
        shell: cmd
        run: utils\legacy-asi\tests\build-and-test.cmd --run
      - name: Test manifest loading in isolated processes
        timeout-minutes: 5
        shell: pwsh
        run: ./utils/legacy-asi/tests/loader_tests.ps1 -Run
      - name: Compile optional private-arena launcher fixtures
        shell: cmd
        run: utils\legacy-asi\launcher\build-and-probe.cmd
      - name: Compile canonical-image Wine probe (own source only)
        shell: cmd
        run: utils\legacy-asi\linux\build-probe.cmd
      - name: Test production canonical launcher, hooks and normal-loader TLS
        shell: pwsh
        run: |
          $probe = Join-Path $PWD 'build/legacy-asi-wine-probe'
          $stdout = Join-Path $probe 'launcher-stdout.txt'
          $stderr = Join-Path $probe 'launcher-stderr.txt'
          $process = Start-Process -FilePath (Join-Path $probe 'reVC.exe') -WorkingDirectory $probe -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(180000)) {
            # The launcher's own job owns its child; never kill other Wine/game processes.
            try { $process.Kill() } catch [InvalidOperationException] { }
            throw 'Canonical launcher probe timed out. No retry is performed.'
          }
          Get-Content -LiteralPath $stdout, $stderr
          if (Test-Path -LiteralPath (Join-Path $probe 'canonical-probe-result.txt')) {
            Get-Content -LiteralPath (Join-Path $probe 'canonical-probe-result.txt')
          }
          if ($process.ExitCode -ne 0) { throw "Canonical launcher probe failed (exit $($process.ExitCode)). No retry is performed." }
          $report = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $probe 'canonical-probe-result.txt')) {
            if ($line.Contains('=')) {
              $pair = $line -split '=', 2
              if ($report.ContainsKey($pair[0])) { throw "Duplicate canonical probe field: $($pair[0])" }
              $report[$pair[0]] = $pair[1]
            }
          }
          foreach ($entry in @{ status='PASS'; stage='complete'; canonical_image='1'; modules='3'; native_events='2'; time_scale='1.750' }.GetEnumerator()) {
            if ($report[$entry.Key] -cne $entry.Value) { throw "Canonical probe report mismatch: $($entry.Key)" }
          }
      - name: Upload source-only Wine probe
        if: matrix.renderer == 'd3d9'
        uses: actions/upload-artifact@v6
        with:
          name: INTERNAL_legacy_asi_canonical_wine_probe
          path: |
            build/legacy-asi-wine-probe/reVC.exe
            build/legacy-asi-wine-probe/reVC-game.exe
            build/legacy-asi-wine-probe/reVC-core.dll
            build/legacy-asi-wine-probe/legacy-asi/
          if-no-files-found: error
          retention-days: 3
      - name: Generate isolated experimental build
        shell: pwsh
        run: |
          ./premake5.exe --with-librw --with-legacy-asi --no-git-hash vs2022
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build experimental game
        # The .sln uses logical platform names but .vcxproj uses physical
        # Win32 and combined configuration names. Build the known dependency
        # order directly, avoiding leaked global Platform properties.
        shell: cmd
        run: |
          msbuild build/legacy-asi/librw.vcxproj /m:1 /nr:false /p:Configuration="Release win-x86-librw_${{ matrix.renderer }}-oal" /p:Platform=Win32
          if errorlevel 1 exit /b 1
          msbuild build/legacy-asi/legacy-bootstrap.vcxproj /m:1 /nr:false /p:Configuration="Release win-x86-librw_${{ matrix.renderer }}-oal" /p:Platform=Win32
          if errorlevel 1 exit /b 1
          msbuild build/legacy-asi/legacy-launcher.vcxproj /m:1 /nr:false /p:Configuration="Release win-x86-librw_${{ matrix.renderer }}-oal" /p:Platform=Win32
          if errorlevel 1 exit /b 1
          msbuild build/legacy-asi/reVC.vcxproj /m:1 /nr:false /p:Configuration="Release win-x86-librw_${{ matrix.renderer }}-oal" /p:Platform=Win32
          if errorlevel 1 exit /b 1
      - name: Include legacy-ASI defaults and x86 runtime dependencies
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'bin/win-x86-librw_${{ matrix.renderer }}-oal-legacy/Release'
          cmake "-DREVC_PACKAGE_DIRECTORY=$package" -P utils/legacy-asi/stage-package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dependency in @('vendor/mpg123/dist/Win32/libmpg123-0.dll', 'vendor/openal-soft/dist/Win32/OpenAL32.dll', 'vendor/libsndfile/dist/Win32/libsndfile-1.dll')) {
            Copy-Item -LiteralPath $dependency -Destination $package
          }
          if ('${{ matrix.renderer }}' -eq 'gl3_glfw') {
            Copy-Item -LiteralPath vendor/glfw-3.4.bin.WIN32/lib-vc2022/glfw3.dll -Destination $package
          }
          Copy-Item -LiteralPath docs/LegacyASI.md -Destination (Join-Path $package 'LegacyASI.md')
          Copy-Item -LiteralPath docs/ModCompatibility.md -Destination (Join-Path $package 'ModCompatibility.md')
          foreach ($required in @('reVC.exe', 'reVC-game.exe', 'reVC-core.dll', 'legacy-asi/enabled.ini', 'legacy-asi/README.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $package $required) -PathType Leaf)) { throw "Missing package file: $required" }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: EXPERIMENTAL_partial_ABI_x86_${{ matrix.renderer }}
          path: bin/win-x86-librw_${{ matrix.renderer }}-oal-legacy/Release/
          if-no-files-found: error

  linux-wine:
    name: Experimental Linux | Wine x86 D3D9
    needs: experimental
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: INTERNAL_legacy_asi_canonical_wine_probe
          path: build/wine-probe
      - uses: actions/download-artifact@v8
        with:
          name: EXPERIMENTAL_partial_ABI_x86_d3d9
          path: build/linux-wine-package
      - name: Install Wine with 32-bit PE support and isolated display
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386 xvfb xauth
      - name: Test real canonical launcher and source-owned ASIs under Wine
        env:
          WINEPREFIX: ${{ runner.temp }}/revc-legacy-canonical-probe
        run: |
          cp utils/legacy-asi/linux/reVC-legacy-asi build/wine-probe/
          python3 build/wine-probe/reVC-legacy-asi --check
          xvfb-run -a python3 utils/legacy-asi/linux/run_probe.py --runtime build/wine-probe
      - name: Retain failed Wine probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-asi-wine-failure-report
          path: build/wine-probe/canonical-probe-result.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Package the Linux-Wine launcher (not the native ELF build)
        run: |
          cp utils/legacy-asi/linux/reVC-legacy-asi build/linux-wine-package/
          chmod +x build/linux-wine-package/reVC-legacy-asi
          python3 build/linux-wine-package/reVC-legacy-asi --check
          # Preserve the executable mode inside upload-artifact's ZIP container.
          tar -C build/linux-wine-package -czf build/reVC-legacy-asi-linux-wine-x86.tar.gz .
      - uses: actions/upload-artifact@v6
        with:
          name: EXPERIMENTAL_partial_ABI_linux-wine-x86_d3d9
          path: build/reVC-legacy-asi-linux-wine-x86.tar.gz
          if-no-files-found: error
